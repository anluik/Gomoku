name: Integration Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  integration-tests:
    name: Integration Tests (Failsafe + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs only *IntTest via Failsafe. skipUnitTests=true keeps Surefire from re-running the unit
      # suite here. Testcontainers uses the Docker daemon preinstalled on GitHub-hosted runners
      # to start a throwaway MongoDB.
      - name: Run integration tests
        run: ./mvnw -B --no-transfer-progress verify -DskipUnitTests=true

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore
